name: Autograding Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '2.7.0'
        bundler-cache: false

    - name: Install Bundler 1.15.3
      run: |
        gem install bundler -v 1.15.3 --no-document

    - name: Remove incompatible ZenTest dependency
      run: |
        python - <<'PY'
        from pathlib import Path

        gemfile = Path('Gemfile')
        lines = gemfile.read_text().splitlines()
        kept = [
            line
            for line in lines
            if not line.strip().startswith("gem 'ZenTest'")
            and not line.strip().startswith('gem "ZenTest"')
        ]
        gemfile.write_text('\n'.join(kept) + '\n')
        PY

    - name: Install app dependencies
      run: bundle _1.15.3_ install --without production

    - name: Install grader gems
      run: |
        gem install rspec -v 3.10.0 --no-document
        gem install nokogiri -v 1.12.5 --no-document
        gem install connection_pool -v 2.5.5 --no-document
        gem install net-http-persistent -v 4.0.1 --no-document
        gem install mechanize -v 2.8.2 --no-document

    - name: Decrypt autograder
      env:
        HW05_KEY: ${{ secrets.HW05_KEY }}
      run: |
        openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
          -pass pass:${HW05_KEY} \
          -in .github/classroom/autograder.tar.gz.enc | \
          tar -xzf - -C .github/classroom/
        # Verify files are present then remove enc file from memory path
        test -f .github/classroom/app_spec.rb
        test -f .github/classroom/Gemfile

    - name: Setup database
      run: RAILS_ENV=development bundle _1.15.3_ exec rake db:setup

    - name: Start Rails server
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      run: |
        export TMDB_API_KEY
        bundle _1.15.3_ exec rails server -e development -p 3000 > /tmp/rails_server.log 2>&1 &
        SERVER_PID=$!
        for i in {1..60}; do
          if curl -fsS http://127.0.0.1:3000/movies >/dev/null; then
            echo "Rails server is ready"
            exit 0
          fi
          sleep 2
        done
        echo "Rails server failed to start in time"
        echo "===== rails server log (tail) ====="
        tail -n 200 /tmp/rails_server.log || true
        kill "$SERVER_PID" || true
        exit 1

    # ==================== HTTP and Form Tests ====================

    - name: App responds to simple request
      id: app-responds
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "App: responds to simple request"
        setup-command: ''
        command: HEROKU_URI=127.0.0.1:3000 ruby -S rspec .github/classroom/app_spec.rb -e "responds to simple request"
        timeout: 20
        max-score: 5

    - name: Search page is successful
      id: search-success
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "GET /search: is successful"
        setup-command: ''
        command: HEROKU_URI=127.0.0.1:3000 ruby -S rspec .github/classroom/app_spec.rb -e "search page is successful"
        timeout: 20
        max-score: 2

    - name: Search title input exists
      id: search-title-field
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "GET /search: title input"
        setup-command: ''
        command: HEROKU_URI=127.0.0.1:3000 ruby -S rspec .github/classroom/app_spec.rb -e "movie_title_field"
        timeout: 20
        max-score: 2

    - name: Search year input exists
      id: search-year-field
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "GET /search: year input"
        setup-command: ''
        command: HEROKU_URI=127.0.0.1:3000 ruby -S rspec .github/classroom/app_spec.rb -e "movie_year_field"
        timeout: 20
        max-score: 2

    - name: Search submit button exists
      id: search-submit-button
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "GET /search: submit button"
        setup-command: ''
        command: HEROKU_URI=127.0.0.1:3000 ruby -S rspec .github/classroom/app_spec.rb -e "tmdb_submit"
        timeout: 20
        max-score: 2

    - name: Warn when both fields empty
      id: empty-fields-warning
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Validation: all fields empty"
        setup-command: ''
        command: HEROKU_URI=127.0.0.1:3000 ruby -S rspec .github/classroom/app_spec.rb -e "all fields are empty"
        timeout: 20
        max-score: 5

    - name: Warn when no matched movies
      id: no-match-warning
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Validation: no matched movies"
        setup-command: ''
        command: HEROKU_URI=127.0.0.1:3000 ruby -S rspec .github/classroom/app_spec.rb -e "no movies are matched"
        timeout: 20
        max-score: 5

    - name: Match all when year empty
      id: year-empty-match-all
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Search: year empty shows all"
        setup-command: ''
        command: HEROKU_URI=127.0.0.1:3000 ruby -S rspec .github/classroom/app_spec.rb -e "year field is empty"
        timeout: 20
        max-score: 5

    - name: Match one (manhunter 1986)
      id: manhunter-1986
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Search: manhunter 1986"
        setup-command: ''
        command: HEROKU_URI=127.0.0.1:3000 ruby -S rspec .github/classroom/app_spec.rb -e "manhunter 1986"
        timeout: 20
        max-score: 5

    - name: Match one (gone girl 2014)
      id: gone-girl-2014
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Search: gone girl 2014"
        setup-command: ''
        command: HEROKU_URI=127.0.0.1:3000 ruby -S rspec .github/classroom/app_spec.rb -e "gone girl 2014"
        timeout: 20
        max-score: 5

    - name: Match one (olympics 2000)
      id: olympics-2000
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Search: olympics 2000"
        setup-command: ''
        command: HEROKU_URI=127.0.0.1:3000 ruby -S rspec .github/classroom/app_spec.rb -e "olympics 2000"
        timeout: 20
        max-score: 5

    - name: Match many (it 2018)
      id: it-2018
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Search: it 2018"
        setup-command: ''
        command: HEROKU_URI=127.0.0.1:3000 ruby -S rspec .github/classroom/app_spec.rb -e "it 2018"
        timeout: 20
        max-score: 5

    - name: No result (halloween 1950)
      id: halloween-1950
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Search: halloween 1950"
        setup-command: ''
        command: HEROKU_URI=127.0.0.1:3000 ruby -S rspec .github/classroom/app_spec.rb -e "does not show any matched movies when year field is not empty"
        timeout: 20
        max-score: 5

    - name: One result (jason 1998)
      id: jason-1998
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Search: jason 1998"
        setup-command: ''
        command: HEROKU_URI=127.0.0.1:3000 ruby -S rspec .github/classroom/app_spec.rb -e "shows one matched movies"
        timeout: 20
        max-score: 5

    - name: Language all has results
      id: language-all
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Search: language all"
        setup-command: ''
        command: HEROKU_URI=127.0.0.1:3000 ruby -S rspec .github/classroom/app_spec.rb -e "language checkbox is set to all"
        timeout: 20
        max-score: 5

    - name: Add first result to DB
      id: add-first-movie
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "DB: add first movie"
        setup-command: ''
        command: HEROKU_URI=127.0.0.1:3000 ruby -S rspec .github/classroom/app_spec.rb -e "adds the first movie"
        timeout: 20
        max-score: 14

    - name: Add movie success flash
      id: add-success-flash
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "DB: add movie success"
        setup-command: ''
        command: HEROKU_URI=127.0.0.1:3000 ruby -S rspec .github/classroom/app_spec.rb -e "shows success when adding movie"
        timeout: 20
        max-score: 9

    - name: Add last result to DB
      id: add-last-movie
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "DB: add last movie"
        setup-command: ''
        command: HEROKU_URI=127.0.0.1:3000 ruby -S rspec .github/classroom/app_spec.rb -e "adds last movie"
        timeout: 20
        max-score: 14

    - name: Cleanup decrypted autograder
      if: always()
      run: |
        rm -f .github/classroom/app_spec.rb .github/classroom/Gemfile

    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        APP-RESPONDS_RESULTS: ${{ steps.app-responds.outputs.result }}
        SEARCH-SUCCESS_RESULTS: ${{ steps.search-success.outputs.result }}
        SEARCH-TITLE-FIELD_RESULTS: ${{ steps.search-title-field.outputs.result }}
        SEARCH-YEAR-FIELD_RESULTS: ${{ steps.search-year-field.outputs.result }}
        SEARCH-SUBMIT-BUTTON_RESULTS: ${{ steps.search-submit-button.outputs.result }}
        EMPTY-FIELDS-WARNING_RESULTS: ${{ steps.empty-fields-warning.outputs.result }}
        NO-MATCH-WARNING_RESULTS: ${{ steps.no-match-warning.outputs.result }}
        YEAR-EMPTY-MATCH-ALL_RESULTS: ${{ steps.year-empty-match-all.outputs.result }}
        MANHUNTER-1986_RESULTS: ${{ steps.manhunter-1986.outputs.result }}
        GONE-GIRL-2014_RESULTS: ${{ steps.gone-girl-2014.outputs.result }}
        OLYMPICS-2000_RESULTS: ${{ steps.olympics-2000.outputs.result }}
        IT-2018_RESULTS: ${{ steps.it-2018.outputs.result }}
        HALLOWEEN-1950_RESULTS: ${{ steps.halloween-1950.outputs.result }}
        JASON-1998_RESULTS: ${{ steps.jason-1998.outputs.result }}
        LANGUAGE-ALL_RESULTS: ${{ steps.language-all.outputs.result }}
        ADD-FIRST-MOVIE_RESULTS: ${{ steps.add-first-movie.outputs.result }}
        ADD-SUCCESS-FLASH_RESULTS: ${{ steps.add-success-flash.outputs.result }}
        ADD-LAST-MOVIE_RESULTS: ${{ steps.add-last-movie.outputs.result }}
      with:
        runners: app-responds,search-success,search-title-field,search-year-field,search-submit-button,empty-fields-warning,no-match-warning,year-empty-match-all,manhunter-1986,gone-girl-2014,olympics-2000,it-2018,halloween-1950,jason-1998,language-all,add-first-movie,add-success-flash,add-last-movie
